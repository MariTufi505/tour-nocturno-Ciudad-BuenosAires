<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secretos de la Ciudad</title>
  </head>

  <body class="page">

    <!-- ===== HEADER / NAV PRINCIPAL ===== -->
    <header class="site-header">
      <a href="/" class="brand" aria-label="Ir al inicio">
        <span class="brand__icon" aria-hidden="true"></span>
        <span class="brand__name">
          <strong>Secretos</strong>
          <span>de la Ciudad</span>
        </span>
      </a>

      <!-- ===== Navegación Inicio/Explorar/Mapa/sobre Nosotros ===== -->
      <nav class="main-nav" aria-label="Navegación principal">
        <ul class="main-nav__list" role="list">
          <li><a href="/"    class="main-nav__link">Inicio</a></li>
          <li><a href="/" class="main-nav__link main-nav__link--active" aria-current="page">Explorar</a></li>
          <li><a href="/"     class="main-nav__link">Mapa</a></li>
          <li><a href="/" class="main-nav__link">Sobre nosotros</a></li>
        </ul>
      </nav>

      <!-- =====  Barra de Búsqueda ===== -->
      <search class="site-search" role="search">
        <label for="search-input" class="sr-only">Buscar lugares</label>
        <input
          id="search-input"
          type="search"
          name="q"
          class="site-search__input"
          placeholder="Buscar lugares..."
          autocomplete="off"
        />
        <button type="submit" class="site-search__btn" aria-label="Buscar">
            <span class="icon icon--search" aria-hidden="true"></span>
        </button>
      </search>

      <!-- Avatar / perfil (sin funcionalidad de usuario por ahora) -->
      <figure class="user-avatar" aria-label="Perfil de usuario">
        <span class="user-avatar__img" aria-hidden="true"></span>
      </figure>
    </header>

    <!-- ===== LAYOUT PRINCIPAL ===== -->
    <main class="site-layout">

      <!-- ===== SIDEBAR IZQUIERDO (Progreso, lugares, guardados, recientes)===== -->
      <aside class="sidebar" aria-label="Panel del explorador">

        <!-- Progreso del usuario -->
        <section class="progress-panel" aria-labelledby="progress-title">
          <h2 id="progress-title" class="progress-panel__title">Tu progreso</h2>
        </section>

        <!-- Listas del usuario -->
        <nav class="user-lists" aria-label="Mis listas">
          <ul class="user-lists__list" role="list">
            <li class="user-lists__item">
              <a href="/guardados" class="user-lists__link">
                <span class="icon icon--bookmark" aria-hidden="true"></span>
                <span class="user-lists__label">Guardados</span>
                <small class="user-lists__count" data-saved-count></small>
              </a>
            </li>
            <li class="user-lists__item">
              <a href="/por-visitar" class="user-lists__link">
                <span class="icon icon--clock" aria-hidden="true"></span>
                <span class="user-lists__label">Por visitar</span>
                <small class="user-lists__count" data-pending-count></small>
              </a>
            </li>
          </ul>
        </nav>

        <!-- Lugares recientes -->
        <section class="recents" aria-labelledby="recents-title">
          <h3 id="recents-title" class="recents__title">Recientes</h3>
          <ul class="recents__list" role="list" data-recents-list>
            <!-- Ítems inyectados por JS -->
          </ul>
          <a href="/" class="recents__see-all">Ver todos</a>
        </section>

        <!-- Mascota / personaje -->
        <aside class="mascot" aria-label="Mascota El Gato">
          <figure class="mascot__figure">
            <span class="mascot__img" aria-hidden="true"></span>
            <figcaption class="mascot__caption">
              <strong class="mascot__name">El gato te observa...</strong>
              <p class="mascot__phrase">Cada rincón tiene su historia</p>
            </figcaption>
          </figure>
        </aside>
      </aside>

        <!-- ===== CONTENIDO PRINCIPAL ===== -->
        <section class="main-content" aria-label="Contenido principal">

            <!-- ===== Acá iria lo que corresponde a la de inicio ===== -->

    </main>

    <!-- ===== FOOTER DEL SITIO ===== -->
    <footer class="site-footer">
      <p class="site-footer__copy">
        &copy; <time datetime="2026">2026</time> Secretos de la Ciudad
      </p>
    </footer>

  </body>
</html>
