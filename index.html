<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secretos de la Ciudad</title>
  </head>

  <body class="page">

    <!-- ===== HEADER / NAV PRINCIPAL ===== -->
    <header class="site-header">
      <a href="/" class="brand" aria-label="Ir al inicio">
        <span class="brand__icon" aria-hidden="true"></span>
        <span class="brand__name">
          <strong>Secretos</strong>
          <span>de la Ciudad</span>
        </span>
      </a>

      <!-- ===== Navegación Inicio/Explorar/Mapa/sobre Nosotros ===== -->
      <nav class="main-nav" aria-label="Navegación principal">
        <ul class="main-nav__list" role="list">
          <li><a href="/"    class="main-nav__link">Inicio</a></li>
          <li><a href="/" class="main-nav__link main-nav__link--active" aria-current="page">Explorar</a></li>
          <li><a href="/"     class="main-nav__link">Mapa</a></li>
          <li><a href="/" class="main-nav__link">Sobre nosotros</a></li>
        </ul>
      </nav>

      <!-- =====  Barra de Búsqueda ===== -->
      <search class="site-search" role="search">
        <label for="search-input" class="sr-only">Buscar lugares</label>
        <input
          id="search-input"
          type="search"
          name="q"
          class="site-search__input"
          placeholder="Buscar lugares..."
          autocomplete="off"
        />
        <button type="submit" class="site-search__btn" aria-label="Buscar">
            <span class="icon icon--search" aria-hidden="true"></span>
        </button>
      </search>

      <!-- Avatar / perfil (sin funcionalidad de usuario por ahora) -->
      <figure class="user-avatar" aria-label="Perfil de usuario">
        <span class="user-avatar__img" aria-hidden="true"></span>
      </figure>
    </header>

    <!-- ===== LAYOUT PRINCIPAL ===== -->
    <main class="site-layout">

        <!-- ═══ HERO ═══ -->
    <section class="hero">
      <!-- <img class="hero__bg" src="ruta/imagen.jpg" alt="" aria-hidden="true"> -->
      <span class="hero__overlay hero__overlay--dark" aria-hidden="true"></span>
      <span class="hero__overlay hero__overlay--purple" aria-hidden="true"></span>
 
      <article class="hero__container">
        <header class="hero__content">
          <address class="hero__badge">
            <figure class="hero__badge-icon" aria-hidden="true">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="14" height="14" aria-hidden="true">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/>
              </svg>
            </figure>
            <span class="hero__badge-text">Buenos Aires, Argentina</span>
          </address>
 
          <h1 class="hero__title">
            Descubre los <em class="hero__title-highlight">Secretos</em> Ocultos de la Ciudad
          </h1>
 
          <p class="hero__description">
            Lugares con historia, misterio y encanto que la mayoría desconoce.
            Cada rincón tiene una historia esperando ser contada.
          </p>
 
          <nav class="hero__actions" aria-label="Acciones principales">
            <button class="hero__btn hero__btn--primary" type="button">
              <svg class="hero__btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="18" height="18" aria-hidden="true">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13l-1 4-4 1 4 1 1 4 1-4 4-1-4-1-1-4z"/>
              </svg>
              Explorar Ahora
            </button>
            <button class="hero__btn hero__btn--secondary" type="button">
              Sobre Nosotros
            </button>
          </nav>
        </header>
 
      </article>
    </section>

    </main>

    <!-- ===== FOOTER DEL SITIO ===== -->
    <footer class="site-footer">
      <p class="site-footer__copy">
        &copy; <time datetime="2026">2026</time> Secretos de la Ciudad
      </p>
    </footer>

  </body>
</html>
